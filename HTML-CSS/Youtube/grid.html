<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Practise</title>
    <style>
        .grid{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 30px;
            row-gap: 40px;
        }
         body{
            padding-top: 100px;
         }
         div{
            height: 300px;
         }
    </style>
</head>
<body>
    <div class="grid">
        <div style="background-color: lightblue;">1</div>
        <div style="background-color: lightcoral;">2</div>
        <div style="background-color: lightblue;">3</div>
        <div style="background-color: lightcoral;">4</div>
        <div style="background-color: lightblue;">5</div>
         <div style="background-color: lightcoral;">6</div>
    </div>

    <h1></h1>
    
</body>
</html>
